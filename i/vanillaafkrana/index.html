<!doctype html>
<html lang="is">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7f2" />
    <meta name="description" content="Vanilla af krana — texti og hljóð í samfelldum lestri." />
    <title>Vanilla af krana — texti og hljóð</title>
    <link rel="stylesheet" href="./book.css?v=20260823-play-icon" />
    <link rel="stylesheet" href="./flow.css?v=20260823-play-icon" />
  </head>
  <body>
    <header class="book-header">
      <a href="./flow.html" class="book-title">Vanilla af krana</a>
      <button id="contents-button" class="text-button" type="button" aria-expanded="false" aria-controls="contents">Efnisyfirlit</button>
    </header>

    <aside id="contents" class="contents" aria-label="Efnisyfirlit" aria-hidden="true" inert>
      <header><strong>Efnisyfirlit</strong><button id="contents-close" type="button" aria-label="Loka efnisyfirliti">×</button></header>
      <div id="contents-list" class="contents-list"></div>
    </aside>

    <main class="reader flow-reader" id="reader">
      <article class="page flow-page" id="page" aria-live="polite">
        <div class="page-running-head"><span id="page-book"></span><span id="page-file"></span></div>
        <div class="page-copy" id="page-copy">
          <p class="chapter-label" id="chapter-label"></p>
          <h1 id="chapter-title"></h1>
          <div id="page-text" class="page-text"></div>
        </div>
        <footer class="page-footer"><span id="track-progress"></span><span id="page-number"></span></footer>
        <button id="previous-page" class="flow-page-edge flow-page-edge-left" type="button" aria-label="Fyrri síða"><span aria-hidden="true">‹</span></button>
        <button id="next-page" class="flow-page-edge flow-page-edge-right" type="button" aria-label="Næsta síða"><span aria-hidden="true">›</span></button>
      </article>
    </main>

    <footer class="audio-bar flow-audio-bar" aria-label="Hljóðspilari">
      <div class="track-title"><small id="track-file">Í LEIT AÐ REGNBOGUM</small><strong id="track-title">Vanilla af krana</strong></div>
      <button id="audio-previous" type="button" aria-label="Fyrri síða">↤</button>
      <button id="play" class="play" type="button" aria-label="Spila"></button>
      <button id="audio-next" type="button" aria-label="Næsta síða">↦</button>
      <div class="timeline"><span id="elapsed">00:00</span><input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Staðsetning í hljóðskrá" /><span id="duration">00:00</span></div>
      <button id="follow" class="follow is-active" type="button" aria-pressed="true"><span>◎</span> Fylgja hljóði</button>
    </footer>

    <audio id="audio" preload="metadata"></audio>
    <script type="module" src="./src/flow-player.js?v=20260823-play-icon"></script>
  </body>
</html>
