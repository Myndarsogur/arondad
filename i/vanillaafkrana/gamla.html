<!doctype html>
<html lang="is">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090a08" />
    <meta name="description" content="Gagnvirk hljóðbók í þrívíðu herbergi." />
    <title>Vanilla af krana — gagnvirk hljóðbók</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#room">Hoppa inn í herbergið</a>
    <header class="site-header">
      <a class="wordmark" href="#" aria-label="Vanilla af krana — forsíða"><span>VANILLA</span><small>AF KRANA</small></a>
      <p class="location"><i></i> HERBERGI 01 / HLJÓÐSAFN</p>
    </header>

    <main class="viewport" id="room">
      <div class="seascape" aria-hidden="true">
        <div class="sky"><i class="cloud cloud-one"></i><i class="cloud cloud-two"></i></div>
        <div class="sun"></div>
        <div class="rainbow rainbow-air"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="horizon"></div>
        <div class="ocean-surface"><i></i><i></i><i></i></div>
        <div class="underwater"></div>
        <div class="rainbow rainbow-water"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="light-point"></div>
        <div class="ship-deck"></div>
        <div class="mast"></div>
        <div class="rigging rigging-left"></div><div class="rigging rigging-right"></div>
      </div>
      <section class="room-view" id="room-view" aria-label="Þrívítt herbergi"><div class="room" id="room-space"></div></section>
      <nav class="look-controls" aria-label="Líta um herbergið">
        <button id="look-left" class="look-arrow" type="button" aria-label="Fyrri bók"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg></button>
        <div class="map-tabs" aria-label="Veldu bók">
          <button type="button" data-view="0" aria-label="Bók 1"><i></i><span>I</span></button>
          <button type="button" data-view="1" aria-label="Bók 2"><i></i><span>II</span></button>
          <button type="button" data-view="2" aria-label="Bók 3"><i></i><span>III</span></button>
        </div>
        <button id="look-right" class="look-arrow" type="button" aria-label="Næsta bók"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8"/></svg></button>
      </nav>
    </main>

    <aside class="player" id="player" aria-label="Hljóðspilari">
      <div class="now-playing"><span class="pulse-bars" aria-hidden="true"><i></i><i></i><i></i></span><div><small>NÚ SPILAST</small><strong id="now-title">Veldu kafla á vegg</strong></div></div>
      <div class="transport">
        <button id="previous" type="button" aria-label="Fyrri kafli">↤</button>
        <button id="play-toggle" class="main-play" type="button" aria-label="Spila">▶</button>
        <button id="next" type="button" aria-label="Næsti kafli">↦</button>
      </div>
      <div class="timeline"><span id="current-time">00:00</span><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Staðsetning í kafla" /><span id="duration">00:00</span></div>
      <button id="mute" class="mute" type="button" aria-label="Slökkva á hljóði">VOL</button>
    </aside>
    <audio id="audio" preload="metadata"></audio>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
