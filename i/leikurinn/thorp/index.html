<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <title>3D heimur</title>
  <style>
    :root {
      --ui-bg: rgba(0, 0, 0, 0.55);
      --ui-text: #f7f7f7;
    }
    body { margin: 0; overflow: hidden; background: #87cefa; }
    canvas { display: block; }
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px 14px;
      background: var(--ui-bg);
      color: var(--ui-text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      border-radius: 6px;
      max-width: 280px;
      z-index: 10;
      line-height: 1.4;
      pointer-events: none;
    }
    #prompt {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      background: var(--ui-bg);
      color: #ffeb3b;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      border-radius: 8px;
      z-index: 10;
      min-width: 180px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    #prompt.visible { opacity: 1; }
    #fractal-hint {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 10px 14px;
      background: var(--ui-bg);
      color: #9cf1ff;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      border-radius: 6px;
      max-width: 240px;
      z-index: 10;
      line-height: 1.4;
      pointer-events: none;
      display: none;
    }
    #popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 20;
    }
    #popup-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #popup-content {
      width: min(90vw, 900px);
      height: min(82vh, 680px);
      background: #d9dce1;
      border: 3px solid #7a7d82;
      border-radius: 6px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    #popup-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 10px 12px;
      background: #c3c6cc;
      border-bottom: 2px solid #7a7d82;
    }
    #popup-close {
      background: #e5e7eb;
      border: 2px solid #3f434a;
      color: #1c1e22;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 14px;
      cursor: pointer;
      font-family: "Courier New", monospace;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    #popup-close:hover { background: #d7dbe0; }
    #popup-frame {
      flex: 1;
      border: 0;
      width: 100%;
      height: 100%;
      background: #fff;
    }
    #minimap {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      pointer-events: none;
    }
    #minimap button {
      pointer-events: auto;
      background:
        linear-gradient(135deg, #6fb46b, #5a9a57) padding-box,
        linear-gradient(135deg, #cbb27a, #a08858) border-box;
      color: #2d2414;
      border: 1px solid rgba(46, 34, 16, 0.6);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    #minimap-canvas {
      pointer-events: auto;
      width: 240px;
      height: 180px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      display: none;
      position: absolute;
      right: 0;
      bottom: 44px;
    }
    #minimap.show #minimap-canvas { display: block; }
  </style>
</head>
<body>
  <audio id="fractal-audio" loop preload="auto" style="display:none">
    <source src="/i/leikurinn/dans/lagid.mp3" type="audio/mpeg">
  </audio>
  <div id="hud" style="display:none"></div>
  <div id="prompt" style="display:none"></div>
  <div id="fractal-hint">Fraktal virkni: notaðu hreyfingar til að hræra í mynstrinu</div>
  <div id="popup-overlay">
    <div id="popup-content">
      <div id="popup-bar">
        <button id="popup-close" type="button">X</button>
      </div>
      <iframe id="popup-frame" src="" title="Forsíða" allow="autoplay"></iframe>
    </div>
  </div>
  <div id="minimap">
    <button id="minimap-toggle" type="button" aria-label="Opna kort">🗺️</button>
    <canvas id="minimap-canvas" width="240" height="180"></canvas>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.159.0/build/three.module.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87cefa); // himinn
    const texLoader = new THREE.TextureLoader();

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
    camera.position.set(0, 320, 10);

    // Lyklaborðs inntak
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);
    // Snertistýring til að labba á síma
    let touchStartPos = null;
    let touchDir = { x: 0, y: 0 };
    let touchTapPos = null;
    const resetTouch = () => { touchDir = { x: 0, y: 0 }; };
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        const t = e.touches[0];
        touchStartPos = { x: t.clientX, y: t.clientY };
        touchTapPos = { x: t.clientX, y: t.clientY };
        touchDir = { x: 0, y: 0 };
        ensureAudio(); // kick ambient/footsteps on first tap (mobile gesture)
      }
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (!touchStartPos || e.touches.length === 0) return;
      const t = e.touches[0];
      const dx = t.clientX - touchStartPos.x;
      const dy = t.clientY - touchStartPos.y;
      const mag = Math.max(1, Math.hypot(dx, dy));
      touchDir = { x: dx / mag, y: dy / mag };
    }, { passive: true });
    window.addEventListener('touchend', () => {
      touchStartPos = null;
      resetTouch();
    });
    window.addEventListener('mousedown', () => {
      ensureAudio(); // desktop gesture fallback
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePopup();
    });

    // Hljóð (þú getur bætt wind.mp3, birds.mp3, footsteps.mp3, bleat.mp3 í sömu möppu)
    let audioInitiated = false;
    let ambientWind = null;
    let ambientBirds = null;
    let footstepAudio = null;
    let bleatAudio = null;
    let audioCtx = null;
    let riverGain = null;
    let riverSource = null;
    let riverBuffer = null;
    let riverLoading = false;
    let riverFailed = false;
    let bleatTimer = 0;
    let footstepActive = false;

    function createAudio(src, loop = false, volume = 1) {
      const a = new Audio(src);
      a.loop = loop;
      a.preload = 'auto';
      a.volume = volume;
      return a;
    }

    function getAudioContext() {
      if (!audioCtx) {
        const ACtx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new ACtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    async function initRiverAudio() {
      if (riverSource || riverLoading || riverFailed) return;
      riverLoading = true;
      try {
        const ctx = getAudioContext();
        const res = await fetch('river.mp3');
        const buf = await res.arrayBuffer();
        riverBuffer = await ctx.decodeAudioData(buf);
        riverSource = ctx.createBufferSource();
        riverSource.buffer = riverBuffer;
        riverSource.loop = true;
        riverGain = ctx.createGain();
        riverGain.gain.value = 0;
        riverSource.connect(riverGain).connect(ctx.destination);
        riverSource.start(0);
      } catch (e) {
        riverFailed = true; // avoid spamming fetch on repeat errors
      } finally {
        riverLoading = false;
      }
    }

    function ensureAudio() {
      if (audioInitiated) return;
      audioInitiated = true;
      try {
        ambientWind = createAudio('wind.mp3', true, 0.25);
        ambientWind.play().catch(() => {});
      } catch (e) {}
      try {
        ambientBirds = createAudio('birds.mp3', true, 0.2);
        ambientBirds.play().catch(() => {});
      } catch (e) {}
      try {
        footstepAudio = createAudio('footsteps.mp3', true, 0.35);
      } catch (e) {}
      try {
        bleatAudio = createAudio('bleat.mp3', false, 0.4);
      } catch (e) {}
      initRiverAudio(); // kick off Web Audio river stream
    }

    function setFootsteps(active) {
      if (!footstepAudio) return;
      if (active && !footstepActive) {
        footstepActive = true;
        footstepAudio.currentTime = 0;
        footstepAudio.play().catch(() => {});
      } else if (!active && footstepActive) {
        footstepActive = false;
        footstepAudio.pause();
      }
    }

    // Ljós
    const hemi = new THREE.HemisphereLight(0xffffff, 0x888844, 0.9);
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(5, 10, 7);
    scene.add(hemi, dir);

    // Jörð með smá áferð
    function makeGroundTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');
      const base = ctx.createLinearGradient(0, 0, 0, 512);
      base.addColorStop(0, '#4fbf73');
      base.addColorStop(1, '#3b9257');
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      for (let i = 0; i < 2000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = Math.random() * 1.8;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }
    const groundTex = makeGroundTexture();
    groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
    groundTex.repeat.set(120, 120);
    const groundGeo = new THREE.PlaneGeometry(5000, 5000, 320, 320);
    const groundMat = new THREE.MeshLambertMaterial({ map: groundTex, vertexColors: true });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    const groundPosAttr = groundGeo.getAttribute('position');
    groundGeo.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(groundPosAttr.count * 3), 3));

    function baseHeight(x, z) {
      const r = Math.hypot(x, z);
      const undulate = Math.sin(x * 0.0012) * 2.4 + Math.cos(z * 0.0014) * 1.8;
      const hill = Math.max(0, 1 - r / 2400) * 8.5;
      return (undulate + hill) * 0.9;
    }
    function reshapeGround(sampleFn) {
      const colors = groundGeo.getAttribute('color');
      const tmpColor = new THREE.Color();
      for (let i = 0; i < groundPosAttr.count; i++) {
        const x = groundPosAttr.getX(i);
        const z = groundPosAttr.getY(i); // PlaneGeometry XY áður en hún er snúin
        const h = sampleFn(x, z);
        groundPosAttr.setZ(i, h);

        // litafall: neðansjávar → blár, lágland → grænt, hærra → brúnleitt
        let c;
        if (h < 0) {
          c = tmpColor.setRGB(0.1, 0.35, 0.65);
        } else if (h < 6) {
          const t = h / 6;
          c = tmpColor.setRGB(
            0.1 + (0.28 - 0.1) * t,
            0.35 + (0.55 - 0.35) * t,
            0.65 - (0.18) * t
          );
        } else {
          const t = Math.min(1, (h - 6) / 40);
          c = tmpColor.setRGB(
            0.28 + (0.38 - 0.28) * t,
            0.55 - (0.18) * t,
            0.47 - (0.37) * t
          );
        }
        colors.setXYZ(i, c.r, c.g, c.b);
      }
      groundPosAttr.needsUpdate = true;
      colors.needsUpdate = true;
      groundGeo.computeVertexNormals();
    }
    reshapeGround(baseHeight);

    const rand = (min, max) => min + Math.random() * (max - min);

    // Djúpivogur OSM grunnur (lat/lon -> local XY)
    // 10 km radíus í kringum Djúpavog (frá hafi að þjóðvegi)
    const osmBounds = { minLat: 64.5685, maxLat: 64.7485, minLon: -14.4948, maxLon: -14.0750 };
    const centerLat = (osmBounds.minLat + osmBounds.maxLat) * 0.5;
    const centerLon = (osmBounds.minLon + osmBounds.maxLon) * 0.5;
    const R = 6378137;
    function mercX(lon) { return R * THREE.MathUtils.degToRad(lon); }
    function mercY(lat) { return R * Math.log(Math.tan(Math.PI / 4 + THREE.MathUtils.degToRad(lat) / 2)); }
    const centerMerc = { x: mercX(centerLon), y: mercY(centerLat) };
    const worldScale = 1; // 1:1 metrar

    function llToXZ(lat, lon) {
      const mx = mercX(lon);
      const my = mercY(lat);
      const dx = (mx - centerMerc.x) * worldScale;
      const dz = -(my - centerMerc.y) * worldScale;
      return { x: dx, z: dz };
    }

    // DEM mapping
    const demBounds = (() => {
      const sw = llToXZ(osmBounds.minLat, osmBounds.minLon);
      const ne = llToXZ(osmBounds.maxLat, osmBounds.maxLon);
      const nw = llToXZ(osmBounds.maxLat, osmBounds.minLon);
      const se = llToXZ(osmBounds.minLat, osmBounds.maxLon);
      return {
        minX: Math.min(sw.x, ne.x, nw.x, se.x),
        maxX: Math.max(sw.x, ne.x, nw.x, se.x),
        minZ: Math.min(sw.z, ne.z, nw.z, se.z),
        maxZ: Math.max(sw.z, ne.z, nw.z, se.z),
      };
    })();
    let demData = null;
    let demCanvas = null;
    let demMeta = { min: 0, max: 0 }; // min/max í metrum

    const roadsGroup = new THREE.Group();
    const buildingsGroup = new THREE.Group();
    const poiGroup = new THREE.Group();
    scene.add(roadsGroup, buildingsGroup, poiGroup);

    const sampleTerrain = (x, z) => {
      const demH = sampleDem(x, z);
      if (demH !== null && demH !== undefined) return demH;
      return baseHeight(x, z);
    };

    let seaLevel = null; // set to a number (t.d. 0) ef þú vilt klemma að sjávarmáli
    const terrainHeight = (x, z) => {
      const h = sampleTerrain(x, z);
      if (seaLevel === null || seaLevel === undefined) return h;
      return Math.max(seaLevel, h);
    };

    // Debug marker á þekkt hnit (miðsvæði Djúpavogs nálægt bæjartorgi)
    const debugLatLon = { lat: 64.6585, lon: -14.2849 };
    const debugPos = llToXZ(debugLatLon.lat, debugLatLon.lon);
    const debugMarker = new THREE.Mesh(
      new THREE.SphereGeometry(6, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xff3333 })
    );
    debugMarker.position.set(
      debugPos.x,
      terrainHeight(debugPos.x, debugPos.z) + 12,
      debugPos.z
    );
    scene.add(debugMarker);

    function parseHeight(tags = {}) {
      if (tags.height) {
        const h = parseFloat(tags.height);
        if (!Number.isNaN(h)) return h;
      }
      if (tags['building:levels']) {
        const levels = parseFloat(tags['building:levels']);
        if (!Number.isNaN(levels)) return 3 + levels * 2.8;
      }
      return 5 + Math.random() * 6;
    }

    function roadWidth(tags = {}) {
      if (tags.width) {
        const w = parseFloat(tags.width);
        if (!Number.isNaN(w)) return w;
      }
      const hw = tags.highway;
      const map = {
        motorway: 10,
        trunk: 9,
        primary: 8,
        secondary: 7,
        tertiary: 6,
        residential: 6,
        service: 4.5,
        track: 4,
        path: 2.4,
        footway: 2,
      };
      return map[hw] || 6;
    }

    function makeRoadMesh(pts, width) {
      if (pts.length < 2) return null;
      const half = width * 0.5;
      const positions = [];
      const indices = [];
      for (let i = 0; i < pts.length; i++) {
        const pPrev = pts[Math.max(0, i - 1)];
        const pNext = pts[Math.min(pts.length - 1, i + 1)];
        const dir = new THREE.Vector2(pNext.x - pPrev.x, pNext.z - pPrev.z);
        if (dir.lengthSq() === 0) continue;
        dir.normalize();
        const perp = new THREE.Vector2(-dir.y, dir.x);
        const p = pts[i];
        positions.push(
          p.x + perp.x * half, p.y, p.z + perp.y * half,
          p.x - perp.x * half, p.y, p.z - perp.y * half
        );
        if (i < pts.length - 1) {
          const base = i * 2;
          indices.push(base, base + 1, base + 2, base + 1, base + 3, base + 2);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial({
        color: 0x0b0b0b,
        emissive: 0x111111,
        emissiveIntensity: 0.55,
        metalness: 0.05,
        roughness: 0.9,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2,
        depthWrite: false,
        depthTest: false,
        transparent: true,
        opacity: 0.98,
      });
      return new THREE.Mesh(geo, mat);
    }

    function addRoad(way) {
      if (!way.geometry || way.geometry.length < 2) return;
      const pts = way.geometry.map((g) => {
        const p = llToXZ(g.lat, g.lon);
        const h = terrainHeight(p.x, p.z);
        return new THREE.Vector3(p.x, h + 0.35, p.z); // lyfta vegum örlítið yfir yfirborð
      });
      const mesh = makeRoadMesh(pts, roadWidth(way.tags) * 1.6); // emphasize width for aerial view
      if (mesh) {
        mesh.renderOrder = 30; // teikna ofar en flest annað
        roadsGroup.add(mesh);
      }
    }

    function addBuilding(way) {
      if (!way.geometry || way.geometry.length < 3) return;
      const pts = way.geometry.map((g) => {
        const p = llToXZ(g.lat, g.lon);
        return new THREE.Vector2(p.x, p.z);
      });
      if (pts.length < 3) return;
      let avgH = 0;
      pts.forEach((p) => { avgH += terrainHeight(p.x, p.y); });
      avgH /= pts.length;
      const shape = new THREE.Shape();
      pts.forEach((p, i) => {
        if (i === 0) shape.moveTo(p.x, p.y);
        else shape.lineTo(p.x, p.y);
      });
      const h = parseHeight(way.tags);
      const extrude = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
      extrude.rotateX(-Math.PI / 2); // gera Z að Y hæð
      const mat = new THREE.MeshStandardMaterial({ color: 0xc5cdd6, metalness: 0.12, roughness: 0.82 });
      const mesh = new THREE.Mesh(extrude, mat);
      mesh.position.y = avgH + 0.05;
      buildingsGroup.add(mesh);
    }

    async function loadDemHeightmap() {
      const metaRes = await fetch('data-new/djupivogur-dem-meta.json').catch(() => null);
      if (metaRes && metaRes.ok) {
        try {
          const metaJson = await metaRes.json();
          demMeta = { min: metaJson.min_elev_m || 0, max: metaJson.max_elev_m || 0 };
        } catch (_) {}
      }
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          demCanvas = document.createElement('canvas');
          demCanvas.width = img.width;
          demCanvas.height = img.height;
          const ctx = demCanvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          demData = ctx.getImageData(0, 0, img.width, img.height);
          resolve();
        };
        img.onerror = reject;
        img.src = 'data-new/djupivogur-dem.png'; // greyscale heightmap (0-255)
      });
    }

    function sampleDem(x, z) {
      if (!demData) return null;
      const u = (x - demBounds.minX) / (demBounds.maxX - demBounds.minX);
      const v = (z - demBounds.minZ) / (demBounds.maxZ - demBounds.minZ);
      if (u < 0 || u > 1 || v < 0 || v > 1) return null;
      const px = Math.min(demData.width - 1, Math.max(0, Math.floor(u * demData.width)));
      const py = Math.min(demData.height - 1, Math.max(0, Math.floor((1 - v) * demData.height)));
      const idx = (py * demData.width + px) * 4;
      const val = demData.data[idx]; // assume greyscale
      const range = (demMeta.max ?? 0) - (demMeta.min ?? 0) || 1;
      return (val / 255) * range + (demMeta.min ?? 0);
    }

    let cachedWays = [];
    let cachedPois = [];

    function rebuildTown() {
      roadsGroup.clear();
      buildingsGroup.clear();
      cachedWays.forEach((w) => {
        if (w.tags?.highway) addRoad(w);
        if (w.tags?.building) addBuilding(w);
      });
    }

    function rebuildPois() {
      poiGroup.clear();
      const allowed = new Set([
        'ferry_terminal','fuel','restaurant','cafe','fast_food','pub','bar','hotel','hostel','guest_house','camp_site',
        'museum','viewpoint','attraction','information','post_office','police','fire_station','hospital','clinic',
        'place_of_worship','theatre','kindergarten','school','charging_station','parking'
      ]);

      const typeColor = (t) => {
        const map = {
          ferry_terminal: '#4fc3f7',
          fuel: '#ffa000',
          restaurant: '#ff7043',
          cafe: '#ffb74d',
          fast_food: '#ff8a65',
          pub: '#f06292',
          bar: '#f06292',
          hotel: '#ba68c8',
          hostel: '#ba68c8',
          guest_house: '#ba68c8',
          camp_site: '#81c784',
          museum: '#90a4ae',
          viewpoint: '#64b5f6',
          attraction: '#64b5f6',
          information: '#4db6ac',
          post_office: '#ffca28',
          police: '#42a5f5',
          fire_station: '#ef5350',
          hospital: '#e53935',
          clinic: '#e53935',

      function makeLabel(text, color) {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 120;
        const ctx = c.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0.78)';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = color;
        ctx.font = 'bold 42px system-ui, sans-serif';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 18, c.height / 2);
        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false });
        const sp = new THREE.Sprite(mat);
        sp.scale.set(60, 14, 1);
        sp.renderOrder = 35;
        return sp;
      }

      cachedPois.forEach((p) => {
        const tags = p.tags || {};
        const type = tags.amenity || tags.tourism;
        if (!allowed.has(type)) return;
        const name = tags.name || type;
        const lat = p.lat ?? p.center?.lat ?? p.geometry?.[0]?.lat;
        const lon = p.lon ?? p.center?.lon ?? p.geometry?.[0]?.lon;
        if (lat === undefined || lon === undefined) return;
        const pos = llToXZ(lat, lon);
        const h = terrainHeight(pos.x, pos.z);
        const markerColor = typeColor(type);
        const marker = new THREE.Mesh(
          new THREE.SphereGeometry(5, 12, 12),
          new THREE.MeshBasicMaterial({ color: markerColor })
        );
        const baseY = h + 12;
        marker.position.set(pos.x, baseY, pos.z);
        marker.renderOrder = 34;

        const label = makeLabel(name, markerColor);
        const labelY = baseY + 36;
        label.position.set(pos.x, labelY, pos.z);

        const lineGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(pos.x, h + 2, pos.z),
          new THREE.Vector3(pos.x, labelY - 4, pos.z),
        ]);
        const lineMat = new THREE.LineBasicMaterial({ color: markerColor, transparent: true, opacity: 0.85, depthTest: false, depthWrite: false });
        const line = new THREE.Line(lineGeo, lineMat);
        line.renderOrder = 33;

        poiGroup.add(marker, label, line);
      });
    }

    function makeTreeTexture(seed = 0) {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const trunkW = rand(12, 20);
      const trunkH = rand(40, 60);
      const trunkX = 64 - trunkW / 2;
      const trunkY = 128 - trunkH - 8;
      ctx.fillStyle = ['#8B5A2B', '#6f4a1e', '#9c6b2f'][seed % 3];
      ctx.fillRect(trunkX, trunkY, trunkW, trunkH); // stöng

      const layers = 2 + (seed % 2);
      ctx.beginPath();
      for (let i = 0; i < layers; i++) {
        const topY = 28 + i * 18;
        const baseY = 78 + i * 10;
        const spread = 32 + i * 10 + rand(-4, 4);
        ctx.beginPath();
        ctx.moveTo(64, topY);
        ctx.lineTo(64 + spread, baseY);
        ctx.lineTo(64 - spread, baseY);
        ctx.closePath();
        ctx.fillStyle = ['#2ECC71', '#2fb06f', '#35d17c'][seed % 3];
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    function makeBuffetTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#d9c3a3';
      ctx.fillRect(0, 0, 256, 256);

      // tabletop with lighter center and dark rim
      const topGrad = ctx.createLinearGradient(0, 176, 0, 256);
      topGrad.addColorStop(0, '#dcb88f');
      topGrad.addColorStop(1, '#c9986c');
      ctx.fillStyle = topGrad;
      ctx.fillRect(8, 170, 240, 70);
      ctx.fillStyle = '#9f7447';
      ctx.fillRect(8, 236, 240, 6);

      function plate(cx, cy, w = 36, h = 12) {
        ctx.fillStyle = '#f2f2f2';
        ctx.beginPath();
        ctx.ellipse(cx, cy, w, h, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      const fruits = [
        { x: 36, y: 152, color: '#ffdf6b', detail: '#e3af3b' },   // banana bunch
        { x: 86, y: 150, color: '#ff3344', detail: '#d81e2c' },   // apples
        { x: 142, y: 148, color: '#ffca4d', detail: '#f59b32' },  // pineapple
        { x: 198, y: 150, color: '#7dd36f', detail: '#4ca957' },  // grapes-ish
        { x: 120, y: 126, color: '#ffa94d', detail: '#f07d2a' },  // oranges
      ];

      fruits.forEach((f, i) => {
        plate(f.x, f.y + 10, 40, 14);
        ctx.fillStyle = f.color;
        if (i === 0) {
          // bananas
          for (let j = 0; j < 5; j++) {
            ctx.beginPath();
            ctx.ellipse(f.x - 12 + j * 7, f.y - 6 + j * 2, 14, 7, 0.5, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#6b4b1f';
          ctx.fillRect(f.x - 14, f.y - 12, 5, 7);
        } else if (i === 2) {
          // pineapple
          ctx.beginPath();
          ctx.ellipse(f.x, f.y - 6, 20, 26, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = f.detail;
          ctx.lineWidth = 2;
          for (let k = -12; k <= 12; k += 5) {
            ctx.beginPath();
            ctx.moveTo(f.x - 18, f.y + k);
            ctx.lineTo(f.x + 18, f.y + k + 16);
            ctx.stroke();
          }
          ctx.fillStyle = '#3d7b2d';
          for (let k = 0; k < 6; k++) {
            ctx.beginPath();
            ctx.moveTo(f.x + k * 4 - 8, f.y - 26);
            ctx.lineTo(f.x + k * 4 - 10, f.y - 34);
            ctx.lineTo(f.x + k * 4 - 12, f.y - 26);
            ctx.fill();
          }
        } else if (i === 3) {
          // grapes
          for (let r = 0; r < 16; r++) {
            const ox = (r % 4) * 8 - 10;
            const oy = Math.floor(r / 4) * 7;
            ctx.beginPath();
            ctx.ellipse(f.x + ox, f.y + oy - 12, 7.5, 7.5, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#3d7b2d';
          ctx.beginPath();
          ctx.moveTo(f.x, f.y - 28);
          ctx.lineTo(f.x - 6, f.y - 38);
          ctx.lineTo(f.x + 4, f.y - 34);
          ctx.fill();
        } else if (i === 4) {
          // oranges
          for (let j = 0; j < 3; j++) {
            ctx.beginPath();
            ctx.ellipse(f.x + j * 10 - 10, f.y - j * 2, 11, 11, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#3d7b2d';
          ctx.fillRect(f.x - 8, f.y - 16, 3, 4);
          ctx.fillRect(f.x, f.y - 18, 3, 4);
          ctx.fillRect(f.x + 8, f.y - 14, 3, 4);
        } else {
          // apples default
          for (let j = 0; j < 4; j++) {
            ctx.beginPath();
            ctx.ellipse(f.x + j * 8 - 12, f.y - j * 2, 11, 11, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#3d7b2d';
          ctx.fillRect(f.x - 8, f.y - 18, 3, 4);
          ctx.fillRect(f.x, f.y - 16, 3, 4);
          ctx.fillRect(f.x + 8, f.y - 14, 3, 4);
        }
      });
      return new THREE.CanvasTexture(c);
    }

      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.fillRect(0, 0, 64, 64);
      ctx.fillStyle = '#ffca4d';
      ctx.beginPath();
      ctx.ellipse(32, 34, 12, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#f59b32';
      ctx.lineWidth = 2;
      for (let k = -12; k <= 12; k += 6) {
        ctx.beginPath();
        ctx.moveTo(20, 30 + k);
        ctx.lineTo(44, 40 + k);

      ctx.fillStyle = '#3d7b2d';
      for (let k = 0; k < 4; k++) {

        ctx.moveTo(26 + k * 4, 16);

    function createFractalGroup(scale = 1, count = 2000, size = 0.25) {
      const group = new THREE.Group();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const golden = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < count; i++) {
        const angle = i * golden;
        const radius = scale * 0.08 * Math.sqrt(i);
        positions[i * 3] = Math.cos(angle) * radius;
        positions[i * 3 + 1] = (i - count / 2) * 0.0035 * scale;
        positions[i * 3 + 2] = Math.sin(angle) * radius;

        const t = i / count;
        colors[i * 3] = 0.5 + 0.5 * Math.sin(t * 10);
        colors[i * 3 + 1] = 0.5 + 0.5 * Math.sin(t * 13 + 1.2);
        colors[i * 3 + 2] = 0.5 + 0.5 * Math.sin(t * 17 + 2.4);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({ size, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false });
      const points = new THREE.Points(geo, mat);
      group.add(points);
      return { group, points };
    }

    let yaw = 0;
    const moveSpeed = 100; // ~1 km á 10 sek
    const rotSpeed = 1.6;
    const flightAltitude = 300; // metrar yfir landi
    let lastTime = performance.now();

    function updateMovement(dt) {
      const forward = (keys['ArrowUp'] || keys['KeyW']) || (touchDir.y < -0.2);
      const backward = (keys['ArrowDown'] || keys['KeyS']) || (touchDir.y > 0.2);
      const left = (keys['ArrowLeft'] || keys['KeyA']) || (touchDir.x < -0.2);
      const right = (keys['ArrowRight'] || keys['KeyD']) || (touchDir.x > 0.2);

      const moving = forward || backward || left || right;
      if (moving) ensureAudio();
      setFootsteps(false); // engin skref í flugi

      if (left && !right) yaw += rotSpeed * dt;
      if (right && !left) yaw -= rotSpeed * dt;

      const dir = new THREE.Vector3();
      if (forward) dir.z -= 1;
      if (backward) dir.z += 1;
      dir.normalize();

      const sin = Math.sin(yaw);
      const cos = Math.cos(yaw);
      const dx = dir.z * sin;
      const dz = dir.z * cos;

      camera.position.x += dx * moveSpeed * dt;
      camera.position.z += dz * moveSpeed * dt;

      camera.rotation.y = yaw;
      const terrainH = terrainHeight(camera.position.x, camera.position.z);
      camera.position.y = terrainH + flightAltitude;
    }

    function updateClouds(dt) {
      clouds.children.forEach(c => {
        c.position.x += c.userData.speed * dt * 8;
        if (c.position.x > c.userData.bound) c.position.x = -c.userData.bound;
      });
    }

    function updateBushes(dt) {
      bushes.children.forEach(b => {
        b.userData.wavePhase += dt * b.userData.waveSpeed;
        const wobble = Math.sin(b.userData.wavePhase) * 0.06;
        b.scale.x = b.userData.baseScale.x * (1 + wobble);
        b.scale.y = b.userData.baseScale.y * (1 + wobble * 0.7);
      });
    }

    function updateSheep(dt) {
      sheep.children.forEach(s => {
        s.userData.grazeTime -= dt;
        if (s.userData.grazeTime <= 0) {
          if (s.userData.state === 'walk') {
            s.userData.state = 'graze';
            s.userData.grazeTime = 2 + Math.random() * 3;
          } else {
            s.userData.state = 'walk';
            s.userData.grazeTime = 4 + Math.random() * 5;
            s.userData.dir += rand(-0.6, 0.6);
          }
        }
        if (s.userData.state === 'walk') {
          s.userData.dir += rand(-0.08, 0.08) * dt;
          const dx = Math.sin(s.userData.dir) * s.userData.speed * dt * 2.4;
          const dz = Math.cos(s.userData.dir) * s.userData.speed * dt * 2.4;
          s.position.x += dx;
          s.position.z += dz;
          const r = Math.hypot(s.position.x, s.position.z);
          const maxR = 180;
          if (r > maxR) {
            s.userData.dir += Math.PI + rand(-0.4, 0.4);
          }
        }
        s.material.rotation = 0;
      });
    }

    function updateBirds(dt) {
      birds.children.forEach(b => {
        b.userData.orbitA += dt * b.userData.speed;
        b.userData.flap += dt * 6;
        const yOsc = Math.sin(b.userData.flap) * 0.4;
        const r = b.userData.orbitR;
        b.position.set(Math.cos(b.userData.orbitA) * r, b.userData.alt + yOsc, Math.sin(b.userData.orbitA) * r);
        b.material.rotation = -b.userData.orbitA + Math.PI / 2;
      });
    }

    function updatePuffin(dt) {
      if (!puffin) return;
      puffin.userData.phase += dt * puffin.userData.speed;
      const sway = Math.sin(puffin.userData.phase) * 0.2;
      const hop = Math.max(0, Math.sin(puffin.userData.phase * 1.4)) * 0.35;
      puffin.position.y = 1.5 + hop;

    function updateFractal(dt) {
      if (!fractalGroup || !fractalData) return;
      fractalDepth += dt * 12;

      const time = performance.now() * 0.001;
      const wobble = Math.sin(time * 0.7) * 0.25;

      fractalGroup.position.z = -fractalDepth * 1.2;
      fractalGroup2.position.z = -fractalDepth * 0.8 - 8;

      fractalGroup.rotation.y += dt * 0.6;
      fractalGroup.rotation.x += dt * 0.14;
      fractalGroup2.rotation.y -= dt * 0.4;
      fractalGroup2.rotation.x += dt * 0.08;

      const posAttr = fractalData.points.geometry.getAttribute('position');
      const posAttr2 = fractalData2.points.geometry.getAttribute('position');
      for (let i = 0; i < posAttr.count; i++) {
        const y = posAttr.getY(i);
        posAttr.setY(i, y + Math.sin(time + i * 0.02) * 0.0008);
      }
      for (let i = 0; i < posAttr2.count; i++) {
        const y = posAttr2.getY(i);
        posAttr2.setY(i, y + Math.cos(time * 1.2 + i * 0.018) * 0.0011);
      }
      posAttr.needsUpdate = true;
      posAttr2.needsUpdate = true;

      // fallandi tilfinning
      camera.position.y = 1.1 + wobble * 0.4;
      camera.position.z -= dt * 10;

      // litaflæði
      const hue = (time * 0.07) % 1;
      scene.background = new THREE.Color().setHSL(hue, 0.6, 0.08 + 0.1 * Math.sin(time * 0.6) * 0.5);
    }

    function checkTarget() {
      if (inFractal) return;
      const dist = camera.position.distanceTo(targetCube.position);
      const near = dist < 3.2;
      if (near) {
        if (!pendingFractal) {
          pendingFractal = true;
          pendingTimer = 0;
        }
      } else {
        pendingFractal = false;
        pendingTimer = 0;
      }
    }

    function checkComputerInteraction() {
      if (inFractal || popupOpen || popupCooldown > 0) return;
      const dist = camera.position.distanceTo(retroComputer.position);
      if (computerNeedsExit && dist < 3.4) return;
      if (dist > 3.4) computerNeedsExit = false;
      if (dist < 2.6) {
        openPopup();
      }
    }

    function checkTowerInteraction() {
      if (inFractal || popupOpen || popupCooldown > 0) return;
      const dist = camera.position.distanceTo(tallTower.position);
      if (towerNeedsExit && dist < 4.5) return;
      if (dist > 4.5) towerNeedsExit = false;
      if (dist < 3.6) {
        openPopup('Annad/index.html');
      }
    }

    function checkFlowerInteraction() {
      if (inFractal || popupOpen || popupCooldown > 0) return;
      const dist = camera.position.distanceTo(sparkFlower.position);
      if (flowerNeedsExit && dist < 4) return;
      if (dist > 4) flowerNeedsExit = false;
      if (dist < 2.8) {
        openPopup('Aldurinn/index.html');
      }
    }

    function checkPuffinInteraction() {
      if (inFractal || popupOpen || popupCooldown > 0) return;
      const dist = camera.position.distanceTo(puffin.position);
      if (puffinNeedsExit && dist < 4.5) return;
      if (dist > 4.5) puffinNeedsExit = false;
      if (dist < 3.2) {
        openPopup('geton/index.html');
      }
    }

    function checkBookInteraction() {
      if (inFractal || popupOpen || popupCooldown > 0) return;
      const dist = camera.position.distanceTo(book.position);
      if (bookNeedsExit && dist < 4.2) return;
      if (dist > 4.2) bookNeedsExit = false;
      if (dist < 3) {
        openPopup('bok/index.html');
      }
    }

    function updateRiverSound(dt) {
      if (riverFailed) return;
      if (!riverSource || !riverGain) {
        if (audioInitiated) initRiverAudio();
        return;
      }
      getAudioContext();
      const dx = camera.position.x - river.position.x;
      const dz = camera.position.z - river.position.z;
      const halfLen = 720 * 0.5;
      const along = Math.max(0, 1 - Math.max(0, Math.abs(dz) - halfLen) / 120);
      const near = Math.max(0, 1 - Math.abs(dx) / 40);
      const t = near * along;
      const target = 0.45 * t;
      const lerp = Math.min(1, dt * 4);
      riverGain.gain.value += (target - riverGain.gain.value) * lerp;
    }

    function renderMinimap() {
      const w = minimapCanvas.width;
      const h = minimapCanvas.height;
      minimapCtx.clearRect(0, 0, w, h);
      minimapCtx.fillStyle = '#5ca66a';
      minimapCtx.fillRect(0, 0, w, h);
      const positions = minimapMarkers.map(m => m.getPos());
      const xs = positions.map(p => p.x);
      const zs = positions.map(p => p.z);
      const minX = Math.min(...xs) - 10;
      const maxX = Math.max(...xs) + 10;
      const minZ = Math.min(...zs) - 10;
      const maxZ = Math.max(...zs) + 10;
      const rangeX = maxX - minX || 1;
      const rangeZ = maxZ - minZ || 1;
      const margin = 18;
      minimapCtx.fillStyle = '#7c6041';
      const peaks = [
        { x: margin + Math.random() * (w - margin * 2), y: h - margin + 6 },
        { x: margin + Math.random() * (w - margin * 2), y: h - margin + 2 },
        { x: margin + Math.random() * (w - margin * 2), y: margin - 2 },
        { x: margin + Math.random() * (w - margin * 2), y: margin + 4 },
        { x: margin + 4, y: margin + Math.random() * (h - margin * 2) },
        { x: margin + 10, y: margin + Math.random() * (h - margin * 2) },
        { x: w - margin - 4, y: margin + Math.random() * (h - margin * 2) },
        { x: w - margin - 10, y: margin + Math.random() * (h - margin * 2) },
      ];
      peaks.forEach(p => {
        const peakH = 10 + Math.random() * 8;
        minimapCtx.beginPath();
        minimapCtx.moveTo(p.x - 10, p.y);
        minimapCtx.lineTo(p.x, p.y - peakH);
        minimapCtx.lineTo(p.x + 10, p.y);
        minimapCtx.closePath();
        minimapCtx.fill();
      });
      function toMap(p) {
        const x = ((p.x - minX) / rangeX) * (w - margin * 2) + margin;
        const y = ((p.z - minZ) / rangeZ) * (h - margin * 2) + margin;
        return {
          x: Math.max(margin, Math.min(w - margin, x)),
          y: Math.max(margin, Math.min(h - margin, y)),
        };
      }
      const mapped = minimapMarkers.map(m => toMap(m.getPos()));
      minimapCtx.setLineDash([4, 6]);
      minimapCtx.strokeStyle = 'rgba(255,255,255,0.45)';
      minimapCtx.lineWidth = 1.5;
      minimapCtx.beginPath();
      mapped.forEach((p, idx) => {
        if (idx === 0) minimapCtx.moveTo(p.x, p.y);
        else minimapCtx.lineTo(p.x, p.y);
      });
      minimapCtx.stroke();
      minimapCtx.setLineDash([]);
    minimapMarkers.forEach(m => {
      const p = toMap(m.getPos());
      minimapCtx.font = '15px system-ui, sans-serif';
      minimapCtx.textAlign = 'center';
      minimapCtx.textBaseline = 'middle';
      minimapCtx.fillStyle = m.color;
      minimapCtx.fillText(m.icon, p.x, p.y);
    });

    }

    function checkBuffetInteraction() {
      if (inFractal || popupOpen || popupCooldown > 0) return;
      const dist = camera.position.distanceTo(buffetTable.position);
      if (buffetNeedsExit && dist < 4.8) return;
      if (dist > 4.8) buffetNeedsExit = false;
      if (dist < 3.4) {
        openPopup('Matarbod/index.html');
      }
    }

    minimapToggle.addEventListener('click', () => {
      minimapEl.classList.toggle('show');
      if (minimapEl.classList.contains('show')) {
        renderMinimap();
      }
    });

    function animate() {
      const now = performance.now();
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      popupCooldown = Math.max(0, popupCooldown - dt);

      // Slembijarm af og til
      if (bleatAudio && audioInitiated) {
        bleatTimer -= dt;
        if (bleatTimer <= 0) {
          if (Math.random() < 0.2) {
            bleatAudio.currentTime = 0;
            bleatAudio.play().catch(() => {});
          }
          bleatTimer = 8 + Math.random() * 16;
        }
      }

      if (!inFractal) {
        updateMovement(dt);
        updateClouds(dt);
        updateBushes(dt);
        updateSheep(dt);
        updateBirds(dt);
        updatePuffin(dt);
        updateRiverSound(dt);
        checkTarget();
        checkComputerInteraction();
        checkTowerInteraction();
        checkFlowerInteraction();
        checkPuffinInteraction();
        checkBookInteraction();
        checkBuffetInteraction();
        if (pendingFractal) {
          pendingTimer += dt;
          yaw += dt * 1.8; // smá snúningur
          camera.rotation.y = yaw;
          camera.rotation.x = Math.sin(pendingTimer * 1.5) * 0.15; // vertical sway
          if (pendingTimer >= 3) {
            enterFractal();
          }
        }
      } else {
        updateMovement(dt * 0.5); // hægari í fraktal
        updateFractal(dt);
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
