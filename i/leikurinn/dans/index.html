  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.159.0/build/three.module.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    // Hljóð
    let music = null;
    let audioReady = false;
    function initAudio() {
      if (audioReady) return;
      audioReady = true;
      try {
        music = new Audio('lagid.mp3');
        music.loop = true;
        music.preload = 'auto';
        music.volume = 0.7;
        music.play().catch(() => {});
      } catch (e) {}
    }

    const uniforms = {
      u_time: { value: 0 },
      u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      u_mouse: { value: new THREE.Vector2(0.5, 0.5) },
      u_phase: { value: Math.random() * 1000 },
      u_depth: { value: 0 },
      u_angle: { value: 0 }
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader: `
        void main() {
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform vec2 u_mouse;
        uniform float u_phase;
        uniform float u_depth;
        uniform float u_angle;

        // Simple palette
        vec3 palette(float t) {
          return 0.5 + 0.5 * cos(vec3(0.0, 2.0, 4.0) + t);
        }

        // Hash for subtle variation
        float hash(vec2 p) {
          p = fract(p * vec2(123.34, 345.45));
          p += dot(p, p + 34.345);
          return fract(p.x * p.y);
        }

        float fieldVal(vec2 uv, vec2 cBase, float t) {
          vec2 z = uv;
          vec2 c = cBase;
          float acc = 0.0;
          for (int i = 0; i < 70; i++) {
            z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
            float l = dot(z, z);
            acc += exp(-float(i) * 0.035) * exp(-l * 0.25);
            if (l > 16.0) break;
          }
          return acc;
        }

        void main() {
          vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
          float t = u_time * 0.4;

          // steerable zoom/tunnel
          float zoom = exp(-u_depth * 0.06);
          uv *= zoom;

          // rotate by angle
          float ca = cos(u_angle), sa = sin(u_angle);
          uv = mat2(ca, -sa, sa, ca) * uv;

          // mouse warp
          uv += (u_mouse - 0.5) * 0.6 * zoom;

          // depth-driven recursion: scale uv for layered fractals
          float depthStep = floor(u_depth * 0.08);
          float baseScale = pow(1.6, depthStep);
          vec2 baseC = vec2(
            0.35 * sin(t * 0.6 + u_phase + u_depth * 0.12) + 0.25 * cos(t * 1.1),
            0.35 * cos(t * 0.4 + u_phase * 0.33 + u_depth * 0.08) + 0.25 * sin(t * 0.9)
          );

          // accumulate multiple nested layers, increase as depth grows
          int layerCount = 4;
          if (u_depth > 40.0) layerCount = 6;
          if (u_depth > 80.0) layerCount = 8;

          vec3 col = vec3(0.0);
          float layerSum = 0.0;
          float depthFactor = clamp(u_depth * 0.01, 0.0, 1.8);
          for (int i = 0; i < 8; i++) {
            if (i >= layerCount) break;
            float fi = float(i);
            float s = baseScale * (1.0 + fi * 0.6 + depthFactor * 0.4);
            vec2 uvL = uv * s + vec2(
              sin(t * 0.4 + fi) * 0.6 + hash(vec2(fi, u_phase)) * 0.6,
              cos(t * 0.3 + fi) * 0.6 + hash(vec2(u_phase, fi)) * 0.6
            );
            float f = fieldVal(uvL, baseC, t);
            float w = 0.55 + fi * 0.35 + depthFactor * 0.2;
            col += palette(t * 0.8 + fi * 1.7 + u_phase * 0.02 + depthFactor * 2.0) * pow(f, 1.25) * w;
            layerSum += w;
            baseC += 0.024 * vec2(f * 0.25, -f * 0.22);
          }
          col /= max(layerSum, 0.0001);

          // tunnel bands with more contrast
          float bands = sin(6.2831 * (uv.y * 3.0 + t * 0.6 + u_depth * 0.15)) * 0.5 + 0.5;
          col = mix(col * 0.9, col * 1.4, bands);

          // star-streaks / slit-scan feel
          float streaks = sin(uv.x * 50.0 + t * 7.0 + u_depth * 0.5) * 0.5 + 0.5;
          streaks *= exp(-abs(uv.y) * 5.0);
          vec3 streakCol = vec3(1.0, 0.7, 1.3) * streaks * 0.5;
          col += streakCol;

          // color jitter + depth glow
          col += 0.18 * vec3(
            sin(uv.x * 12.0 + t + u_depth * 0.33),
            sin(uv.y * 12.0 + t * 1.3 - u_depth * 0.27),
            sin((uv.x + uv.y) * 10.0 - t * 0.8 + u_depth * 0.5)
          );
          col *= 1.0 + 0.15 * depthFactor;

          // swirling inward detail without tiles
          float spin = t * 0.3 + depthFactor * 0.4;
          float cs = cos(spin), sn = sin(spin);
          vec2 uvSpiral = mat2(cs, -sn, sn, cs) * uv * (1.5 + depthFactor * 0.8);
          float spiralVal = fieldVal(uvSpiral, baseC + vec2(0.12 * sin(t), 0.12 * cos(t)), t);
          col += palette(t * 1.4 + u_phase * 0.05 + depthFactor * 3.2) * pow(spiralVal, 1.45) * 0.55;

          // keep center from washing out: add radial mix and clamp brightness
          float r = length(uv) * zoom;
          vec3 vivid = palette(t * 1.5 + u_phase * 0.05 + depthFactor * 3.0);
          float vign = smoothstep(0.08, 0.4, r);
          col = mix(vivid * 0.8 + col * 0.4, col, vign);
          vec3 vividCenter = palette(t * 2.3 + depthFactor * 5.0 + u_phase * 0.1);
          col = mix(vividCenter * 0.7 + col * 0.5, col, smoothstep(0.15, 0.55, r));

          // soft clamp to avoid white blowout
          col = col / (1.0 + col * 0.45);
          col = clamp(col, 0.0, 1.05);

          // chromatic swirl to break uniformity
          col.r += 0.1 * sin(t * 2.0 + r * 18.0);
          col.b += 0.1 * cos(t * 1.6 - r * 14.0);

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });

    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(quad);

    // movement controls
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });
    window.addEventListener('mousedown', initAudio);
    window.addEventListener('touchstart', () => { initAudio(); touchActive = true; }, { passive: true });
    window.addEventListener('touchend', () => { touchActive = false; });

    let depth = 0;
    let angle = 0;
    const moveSpeed = 2;
    const turnSpeed = 1.6;
    let touchActive = false;
    let lastTouch = { x: 0.5, y: 0.5 };

    let lastTime = performance.now();
    function animate() {
      const now = performance.now();
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      // update controls
      const forward = keys['ArrowUp'] || keys['KeyW'] || touchActive;
      const back = keys['ArrowDown'] || keys['KeyS'];
      const left = keys['ArrowLeft'] || keys['KeyA'];
      const right = keys['ArrowRight'] || keys['KeyD'];

      if (forward && !back) depth += moveSpeed * dt;
      if (back && !forward) depth = Math.max(0.0, depth - moveSpeed * dt * 0.6);
      if (left && !right) angle += turnSpeed * dt;
      if (right && !left) angle -= turnSpeed * dt;
      if (touchActive) {
        const turn = (lastTouch.x - 0.5) * 2.0;
        angle += turn * turnSpeed * dt;
      }

      uniforms.u_depth.value = depth;
      uniforms.u_angle.value = angle;
      uniforms.u_time.value += dt;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    });

    window.addEventListener('mousemove', (e) => {
      uniforms.u_mouse.value.set(e.clientX / window.innerWidth, 1.0 - e.clientY / window.innerHeight);
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const t = e.touches[0];
        uniforms.u_mouse.value.set(t.clientX / window.innerWidth, 1.0 - t.clientY / window.innerHeight);
        lastTouch = { x: t.clientX / window.innerWidth, y: 1.0 - t.clientY / window.innerHeight };
      }
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyR') {
        uniforms.u_phase.value = Math.random() * 1000.0;
      }
      if (e.code === 'KeyE' || e.code === 'Space') {
        window.location.href = 'index.html';
      }
      initAudio();
    });
  </script>
</body>
</html>
