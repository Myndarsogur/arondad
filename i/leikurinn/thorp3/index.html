<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <title>Djúpivogur 3D Papertown</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; overflow: hidden; background: #0b0d13; }
    #hud {
      position: fixed; top: 10px; left: 10px;
      padding: 10px 14px; background: rgba(0,0,0,0.5);
      color: #e9edf4; font-family: system-ui,-apple-system,sans-serif;
      font-size: 14px; border-radius: 8px; line-height: 1.5;
      pointer-events: none; z-index: 10;
    }
    #hud strong { color: #9cf1ff; }
  </style>
</head>
<body>
  <div id="hud">
    <div><strong>WASD</strong> / örvar: hreyfing • <strong>Q/E</strong>: snúa • <strong>Shift</strong>: hraðar</div>
    <div><strong>H</strong>: fela/sýna merki</div>
  </div>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.159.0/build/three.module.js';

    // === Grunnstilling ===
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0d13);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 8000);
    camera.position.set(0, 3, 40);

    const ambient = new THREE.AmbientLight(0xffffff, 0.55);
    const sun = new THREE.DirectionalLight(0xffffff, 0.7);
    sun.position.set(80, 200, 120);
    scene.add(ambient, sun);

    // === Gögn & vörpun ===
    const dataBase = '../thorp/data-new/';
    const bounds = { minLat: 64.642, maxLat: 64.676, minLon: -14.333, maxLon: -14.245 };
    const R = 6378137;
    const mercX = lon => R * THREE.MathUtils.degToRad(lon);
    const mercY = lat => R * Math.log(Math.tan(Math.PI / 4 + THREE.MathUtils.degToRad(lat) / 2));
    const xMin = mercX(bounds.minLon), xMax = mercX(bounds.maxLon);
    const yMin = mercY(bounds.minLat), yMax = mercY(bounds.maxLat);
    const centerX = (xMin + xMax) * 0.5;
    const centerY = (yMin + yMax) * 0.5;
    const worldScale = 1;

    function llToXZ(lat, lon) {
      const mx = mercX(lon);
      const my = mercY(lat);
      return {
        x: (mx - centerX) * worldScale,
        z: -(my - centerY) * worldScale,
      };
    }

    // === DEM hæðir ===
    let demData = null;
    let demMeta = { min: 0, max: 0 };
    async function loadDem() {
      const meta = await fetch(dataBase + 'djupivogur-dem-meta.json').then(r => r.json()).catch(() => null);
      if (meta) demMeta = { min: meta.min_elev_m || 0, max: meta.max_elev_m || 0 };
      const img = await new Promise((resolve, reject) => {
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = reject;
        im.src = dataBase + 'djupivogur-dem.png';
      });
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      demData = ctx.getImageData(0, 0, img.width, img.height);
      return { w: img.width, h: img.height };
    }
    const demBounds = (() => {
      const sw = llToXZ(bounds.minLat, bounds.minLon);
      const ne = llToXZ(bounds.maxLat, bounds.maxLon);
      const nw = llToXZ(bounds.maxLat, bounds.minLon);
      const se = llToXZ(bounds.minLat, bounds.maxLon);
      return {
        minX: Math.min(sw.x, ne.x, nw.x, se.x),
        maxX: Math.max(sw.x, ne.x, nw.x, se.x),
        minZ: Math.min(sw.z, ne.z, nw.z, se.z),
        maxZ: Math.max(sw.z, ne.z, nw.z, se.z),
      };
    })();

    function sampleDem(x, z) {
      if (!demData) return 0;
      const u = (x - demBounds.minX) / (demBounds.maxX - demBounds.minX);
      const v = (z - demBounds.minZ) / (demBounds.maxZ - demBounds.minZ);
      if (u < 0 || u > 1 || v < 0 || v > 1) return 0;
      const px = Math.min(demData.width - 1, Math.max(0, Math.floor(u * demData.width)));
      const py = Math.min(demData.height - 1, Math.max(0, Math.floor((1 - v) * demData.height)));
      const idx = (py * demData.width + px) * 4;
      const val = demData.data[idx]; // greyscale
      const range = (demMeta.max - demMeta.min) || 1;
      return (val / 255) * range + demMeta.min;
    }

    // === Grunnflötur (papertown) ===
    const groundGeo = new THREE.PlaneGeometry(600, 600, 256, 256);
    const gp = groundGeo.getAttribute('position');
    for (let i = 0; i < gp.count; i++) {
      const x = gp.getX(i);
      const z = gp.getY(i);
      const h = sampleDem(x, z) * 0.3; // mælikvarði hæðar
      gp.setZ(i, h);
    }
    gp.needsUpdate = true;
    groundGeo.computeVertexNormals();
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x3b8f5a,
      roughness: 0.9,
      metalness: 0.05,
      flatShading: true
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // === Hópar ===
    const roadsGroup = new THREE.Group();
    const buildingsGroup = new THREE.Group();
    const poiGroup = new THREE.Group();
    scene.add(roadsGroup, buildingsGroup, poiGroup);

    // === Gerð vegagerðar ===
    function roadWidth(tags = {}) {
      if (tags.width && !isNaN(parseFloat(tags.width))) return parseFloat(tags.width);
      const map = { motorway: 12, trunk: 11, primary: 10, secondary: 9, tertiary: 8, residential: 7, service: 5, track: 4, path: 2.5, footway: 2 };
      return map[tags.highway] || 6;
    }

    function addRoad(way) {
      if (!way.geometry || way.geometry.length < 2) return;
      const pts = way.geometry.map(g => {
        const p = llToXZ(g.lat, g.lon);
        return new THREE.Vector3(p.x, sampleDem(p.x, p.z) * 0.3 + 0.12, p.z);
      });
      const baseWidth = roadWidth(way.tags) * 1.35;

      const buildGeo = (half) => {
        const positions = [];
        const indices = [];
        for (let i = 0; i < pts.length; i++) {
          const pPrev = pts[Math.max(0, i - 1)];
          const pNext = pts[Math.min(pts.length - 1, i + 1)];
          const dir = new THREE.Vector2(pNext.x - pPrev.x, pNext.z - pPrev.z);
          if (dir.lengthSq() === 0) continue;
          dir.normalize();
          const perp = new THREE.Vector2(-dir.y, dir.x);
          const p = pts[i];
          positions.push(
            p.x + perp.x * half, p.y, p.z + perp.y * half,
            p.x - perp.x * half, p.y, p.z - perp.y * half
          );
          if (i < pts.length - 1) {
            const base = i * 2;
            indices.push(base, base + 1, base + 2, base + 1, base + 3, base + 2);
          }
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      };

      // Undirlag (dökk halo)
      const geoBase = buildGeo(baseWidth * 0.6);
      const matBase = new THREE.MeshStandardMaterial({
        color: 0x0b0d13,
        emissive: 0x0b0d13,
        emissiveIntensity: 0.4,
        roughness: 0.9,
        metalness: 0.02,
        flatShading: true,
        depthWrite: false,
      });
      const meshBase = new THREE.Mesh(geoBase, matBase);
      meshBase.renderOrder = 18;

      // Ljós topplag
      const geoTop = buildGeo(baseWidth * 0.5);
      const matTop = new THREE.MeshStandardMaterial({
        color: 0xf6f8fc,
        emissive: 0xcfd8ff,
        emissiveIntensity: 0.9,
        roughness: 0.35,
        metalness: 0.05,
        flatShading: true,
        depthTest: false,
        depthWrite: false,
        transparent: true,
        opacity: 0.98,
      });
      const meshTop = new THREE.Mesh(geoTop, matTop);
      meshTop.renderOrder = 19;

      roadsGroup.add(meshBase, meshTop);
    }

    // === Byggingar ===
    function parseHeight(tags = {}) {
      if (tags.height && !isNaN(parseFloat(tags.height))) return parseFloat(tags.height);
      if (tags['building:levels'] && !isNaN(parseFloat(tags['building:levels']))) {
        return 3 + parseFloat(tags['building:levels']) * 3;
      }
      return 6 + Math.random() * 6;
    }

    function addBuilding(way) {
      if (!way.geometry || way.geometry.length < 3) return;
      const pts = way.geometry.map(g => {
        const p = llToXZ(g.lat, g.lon);
        return new THREE.Vector2(p.x, p.z);
      });
      const shape = new THREE.Shape();
      pts.forEach((p, i) => i === 0 ? shape.moveTo(p.x, p.y) : shape.lineTo(p.x, p.y));
      const h = parseHeight(way.tags);
      const extrude = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
      extrude.rotateX(-Math.PI / 2);
      // set base height to average terrain
      let avgH = 0;
      pts.forEach(p => avgH += sampleDem(p.x, p.y) * 0.3);
      avgH /= pts.length;
      const mat = new THREE.MeshStandardMaterial({
        color: 0xc5cdd6,
        roughness: 0.9,
        metalness: 0.05,
        flatShading: true
      });
      const mesh = new THREE.Mesh(extrude, mat);
      mesh.position.y = avgH + 0.05;
      buildingsGroup.add(mesh);
    }

    // === POI ===
    const poiColors = {
      restaurant: '#ff7043', cafe: '#ffb74d', fast_food: '#ff8a65', pub: '#f06292', bar: '#f06292',
      fuel: '#ffa000', hotel: '#ba68c8', hostel: '#ba68c8', guest_house: '#ba68c8', camp_site: '#81c784',
      museum: '#90a4ae', viewpoint: '#64b5f6', attraction: '#64b5f6', information: '#4db6ac',
      post_office: '#ffca28', police: '#42a5f5', fire_station: '#ef5350', hospital: '#e53935', clinic: '#e53935',
      place_of_worship: '#9575cd', theatre: '#ce93d8', kindergarten: '#aed581', school: '#aed581',
      charging_station: '#26c6da', parking: '#90a4ae', ferry_terminal: '#4fc3f7', default: '#f06292'
    };
    const allowedPoi = new Set([
      'ferry_terminal','fuel','restaurant','cafe','fast_food','pub','bar','hotel','hostel','guest_house','camp_site',
      'museum','viewpoint','attraction','information','post_office','police','fire_station','hospital','clinic',
      'place_of_worship','theatre','kindergarten','school','charging_station','parking'
    ]);

    function addPoi(p) {
      const tags = p.tags || {};
      const type = tags.amenity || tags.tourism;
      if (!allowedPoi.has(type)) return;
      const name = tags.name || type;
      const lat = p.lat ?? p.center?.lat ?? p.geometry?.[0]?.lat;
      const lon = p.lon ?? p.center?.lon ?? p.geometry?.[0]?.lon;
      if (lat === undefined || lon === undefined) return;
      const pos = llToXZ(lat, lon);
      const baseH = sampleDem(pos.x, pos.z) * 0.3;
      const color = poiColors[type] || poiColors.default;
      const marker = new THREE.Mesh(
        new THREE.ConeGeometry(1.2, 3, 6),
        new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4, flatShading: true })
      );
      marker.position.set(pos.x, baseH + 6, pos.z);
      marker.rotation.x = Math.PI;
      const label = makeLabel(name, color);
      label.position.set(pos.x, baseH + 9, pos.z);
      poiGroup.add(marker, label);
    }

    function makeLabel(text, color) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = color;
      ctx.font = 'bold 28px system-ui, sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 10, c.height / 2);
      const tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
      spr.scale.set(16, 4, 1);
      spr.renderOrder = 25;
      return spr;
    }

    // === Hreyfing ===
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyH') poiGroup.visible = !poiGroup.visible; });
    window.addEventListener('keyup', e => keys[e.code] = false);
    let yaw = 0;
    const baseSpeed = 48;
    function updateMovement(dt) {
      const forward = keys['KeyW'] || keys['ArrowUp'];
      const backward = keys['KeyS'] || keys['ArrowDown'];
      const left = keys['KeyA'] || keys['ArrowLeft'];
      const right = keys['KeyD'] || keys['ArrowRight'];
      if (keys['KeyQ']) yaw += 1.4 * dt;
      if (keys['KeyE']) yaw -= 1.4 * dt;
      const dir = new THREE.Vector3();
      if (forward) dir.z -= 1;
      if (backward) dir.z += 1;
      dir.normalize();
      const sin = Math.sin(yaw), cos = Math.cos(yaw);
      const dx = dir.z * sin;
      const dz = dir.z * cos;
      const speed = baseSpeed * (keys['ShiftLeft'] ? 2.2 : 1);
      camera.position.x += dx * speed * dt;
      camera.position.z += dz * speed * dt;
      const terrainH = sampleDem(camera.position.x, camera.position.z) * 0.3;
      camera.position.y = terrainH + 3;
      camera.rotation.y = yaw;
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);

    // === Hleðsla & teiknun ===
    async function init() {
      await loadDem();
      const [osm, poi] = await Promise.all([
        fetch(dataBase + 'djupivogur-osm.json').then(r => r.json()),
        fetch(dataBase + 'djupivogur-poi.json').then(r => r.json()),
      ]);
      const ways = osm.elements?.filter?.(e => e.type === 'way') || [];
      ways.forEach(w => {
        if (w.tags?.highway) addRoad(w);
        if (w.tags?.building) addBuilding(w);
      });
      const pois = poi.elements || [];
      pois.forEach(addPoi);
      animate();
    }

    let last = performance.now();
    function animate() {
      const now = performance.now();
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      updateMovement(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    init().catch(err => console.error(err));
  </script>
</body>
</html>
