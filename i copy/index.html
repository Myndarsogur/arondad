    <style>
      :root {
        --ink: #1b1f24;
        --link: #1a5a7a;
        --link-hover: #0b3d52;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: transparent;
        color: var(--ink);
        font-family: "Iowan Old Style", "Palatino Linotype", "Bookman Old Style", serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        padding: 140px 20px 60px;
      }

      html,
      body {
        background: transparent;
      }

      main {
        width: min(1040px, 100%);
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(180px, 0.95fr);
        gap: 28px;
        text-align: left;
        align-items: start;
        min-height: clamp(620px, 78vh, 760px);
      }

      .content {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
        min-height: clamp(400px, 60vh, 520px);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 2.6rem);
        letter-spacing: 0.02em;
      }

      h2 {
        margin: 8px 0 4px;
        font-size: clamp(1.25rem, 2.4vw, 1.45rem);
        letter-spacing: 0.01em;
      }

      p {
        margin: 0;
        font-size: clamp(1.05rem, 2.2vw, 1.25rem);
        line-height: 1.6;
        color: #2f3439;
      }

      .links {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        align-items: center;
        padding-top: 8px;
        margin-top: auto;
      }

      .logos {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        justify-content: flex-start;
      }

      .logo-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
      }

      .logo-link {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        padding: 4px 0;
        width: min(220px, 100%);
      }

      .logo-link img {
        display: block;
        max-width: 200px;
        max-height: 90px;
        width: 100%;
        height: auto;
        object-fit: contain;
        filter: none;
        transition: none;
      }

      .logo-link::after {
        display: none;
      }

      .profile-image {
        display: block;
        width: min(120px, 40%);
        height: auto;
        flex-shrink: 0;
        align-self: flex-start;
      }

      a {
        font-size: clamp(1.05rem, 2.2vw, 1.25rem);
        letter-spacing: 0.02em;
        color: var(--link);
        text-decoration: none;
        position: relative;
        padding-bottom: 2px;
      }

      a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 2px;
        background: currentColor;
        transform: scaleX(0);
        transform-origin: center;
        transition: transform 200ms ease;
      }

      a:hover::after,
      a:focus-visible::after {
        transform: scaleX(1);
      }

      @media (prefers-reduced-motion: reduce) {
        a::after {
          transition: none;
        }

        .logo-link img {
          transition: none;
        }
      }

      @media (max-width: 720px) {
        main {
          grid-template-columns: 1.05fr 0.95fr;
          gap: 16px;
          align-items: start;
        }

        .logo-link img {
          max-width: 150px;
          max-height: 70px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="content">
        <h1 id="main-title">Aron Daði</h1>
        <p id="main-lead">
          Aron Daði (Aron) er á bak við þessa síðu.
        </p>
        <p id="main-body">
          Ef þú vilt ná sambandi, sendu endilega tölvupóst.
        </p>
        <div class="links">
          <a href="mailto:i@aron.dad">Sendu mér tölvupóst</a>
          <a href="https://www.linkedin.com/in/arondad" rel="me">LinkedIn</a>
          <a href="/">Til baka á forsíðu</a>
        </div>
      </div>
      <section class="logos" aria-label="Önnur verkefni">
        <div class="logo-list">
          <a
            class="logo-link"
            href="https://villt.is"
            target="_blank"
            rel="noopener"
            data-title="Villt"
            data-lead="Samansafn af tónlist, myndböndum, ljóðum og bókum sem hafa verið sett saman gegnum árin."
            data-body="Síðan inniheldur ekki tæmandi yfirlit yfir ferilinn, en gefur einhverskonar innlit í vinnuna sem þar hefur átt sér stað."
          >
            <img src="logo/villt.png" alt="Villt.is merki" loading="lazy" />
          </a>
          <a
            class="logo-link"
            href="https://arcticcomics.org"
            target="_blank"
            rel="noopener"
            data-title="The Arctic Comics Journal"
            data-lead="Samvinnuverkefni milli svæða á norðurskautinu þar sem að frásagnir einstaklinga sem að þar búa eru dregnar fram."
            data-body="Markmiðið er að brúa bilið milli samfélaga sem eiga svo margt sameiginlegt en ná svo lítilli snertingu við hvort annað."
          >
            <img src="logo/arctic.svg" alt="Arctic Comics Journal merki" loading="lazy" />
          </a>
          <a
            class="logo-link"
            href="https://myndarsogur.is"
            target="_blank"
            rel="noopener"
            data-title="Myndarsögur"
            data-lead="Óhagnaðardrifin myndasögútgáfa sem stuðlar að vegsemd myndasögunnar á Íslandi."
            data-body="Útgáfan hefur komið út síðan 2026 og eru nú til 6 eintök með sögum eftir 76 höfunda."
          >
            <img src="logo/myndarsogur.PNG" alt="Myndarsogur.is merki" loading="lazy" />
          </a>
          <a
            class="logo-link"
            href="https://islandcomics.org"
            target="_blank"
            rel="noopener"
            data-title="Island Comics"
            data-lead="Nýr sagnabálkur sem að safnar saman myndasögum frá eyjasvæðum í atlantshafi."
            data-body="Við vitum að það er hafið sem heldur okkur öllum í sundur en hvað er það sem að tengir okkur öll saman?"
          >
            <img src="logo/island.svg" alt="Island Comics merki" loading="lazy" />
          </a>
        </div>
        <img
          class="profile-image"
          src="/mynd.avif"
          alt="Aron Daði"
          loading="lazy"
        />
      </section>
    </main>
    <script>
      const titleEl = document.getElementById("main-title");
      const leadEl = document.getElementById("main-lead");
      const bodyEl = document.getElementById("main-body");
      const defaultContent = {
        title: "Aron Daði",
        lead: "Aron Daði (Aron) er á bak við þessa síðu.",
        body: "Ef þú vilt ná sambandi, sendu endilega tölvupóst.",
      };

      const logoLinks = document.querySelectorAll(".logo-link");
      const profileImage = document.querySelector(".profile-image");

      const setContent = ({ title, lead, body }) => {
        titleEl.textContent = title;
        leadEl.textContent = lead;
        bodyEl.textContent = body;
      };

      const resetContent = () => setContent(defaultContent);

      logoLinks.forEach((link) => {
        const data = {
          title: link.dataset.title,
          lead: link.dataset.lead,
          body: link.dataset.body,
        };

        link.addEventListener("mouseenter", () => setContent(data));
        link.addEventListener("focus", () => setContent(data));
      });

      if (profileImage) {
        profileImage.addEventListener("mouseenter", resetContent);
        profileImage.addEventListener("focus", resetContent);
      }
    </script>
  </body>
</html>
